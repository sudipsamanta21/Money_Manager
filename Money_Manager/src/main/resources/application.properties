spring.application.name=Money_Manager
server.port=8080
server.servlet.context-path=/api/v1.0


#
## MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/money_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=
#spring.datasource.password=


# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

##For MySQL -->
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${USER_NAME}
spring.mail.password=${PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.protocol=smtp
spring.mail.properties.mail.from=${SEND_FROM}


#JWT
jwt.secret=${JWT_TOKEN}
jwt.expiration=${JWT_TIME}

# Frontend
money.manager.frontend.url=http://localhost:5173

#import </> application-prod.properties
spring.profiles.active=prod

#Backend
money.manager.backend.url=http://localhost:8080

